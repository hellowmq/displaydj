name: macOS checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build all products
        run: swift build
      - name: Run test suite
        run: swift test
      - name: CLI and isolated HTTP smoke test
        run: python3 scripts/smoke.py
      - name: Build application bundle
        run: bash scripts/build-app.sh
